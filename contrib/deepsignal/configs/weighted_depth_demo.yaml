# Offline-only logger chain. The fixture path is generated by the test package.
readers:
  class: TextFileReader
  module: logger.readers.text_file_reader
  kwargs:
    file_spec: contrib/deepsignal/test/weighted_depth/data/demo.jsonl
transforms:
  - class: WeightedDepthTransform
    module: contrib.deepsignal.weighted_depth.transform
    kwargs:
      reference_surface: waterline
      draft_sign: positive_down
      process_acceleration_m2_s3: 0.01
      sources:
        - field: MB_NadirDepth
          time_field: MB_PingTime
          role: depth
          family: multibeam
          raw_parent_fields: [MB_NadirDepth, MB_PingTime]
          offset_m: 0.0
          datum: waterline
          max_age_s: 2.0
          private_sd_m: 0.20
          shared_loadings: [1.0]
          footprint_m: [5.0, 5.0]
writers:
  class: TextFileWriter
  module: logger.writers.text_file_writer
  kwargs:
    filename: /tmp/weighted_depth_demo.jsonl
interval: 1.0
check_format: false
