<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>DeepSignal Console</title>
    <script>/* console lighting boot */</script>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <filter id="night-red-output" color-interpolation-filters="sRGB">
        <feColorMatrix result="channelLimit" values="
          1     0 0 0 0
          0.075 0 0 0 0
          0.075 0 0 0 0
          0     0 0 1 0" />
        <feBlend in="SourceGraphic" in2="channelLimit" mode="darken" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
