[program:cds-gateway]
command=python3 -m contrib.deepsignal.security.cds_gateway --host 127.0.0.1 --port 8767 --upstream ws://127.0.0.1:8766
directory=/opt/openrvdas
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/openrvdas/cds-gateway.log
