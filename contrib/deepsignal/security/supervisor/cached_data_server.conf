[program:cached_data_server]
command=python3 server/cached_data_server.py --port 8766 --host 127.0.0.1 --udp "%(ENV_CDS_UDP_PORTS)s" --udp_interface "%(ENV_CDS_UDP_INTERFACE)s" --disk_cache /var/tmp/openrvdas/disk_cache --max_records 8640 -v
directory=/opt/openrvdas
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/openrvdas/cached_data_server.log
